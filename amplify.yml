version: 1
frontend:
  phases:
    preBuild:
      commands:
        - npm ci
    build:
      commands:
        - env | grep -E '^(MONGODB_URI|AUTH_SECRET|AUTH_URL|GOOGLE_CLIENT_ID|GOOGLE_CLIENT_SECRET|S3_ACCESS_KEY_ID|S3_SECRET_ACCESS_KEY|S3_REGION|S3_BUCKET|RESEND_API_KEY|EMAIL_FROM|SMTP_HOST|SMTP_PORT|SMTP_USER|SMTP_PASSWORD|RAZORPAY_KEY_ID|RAZORPAY_KEY_SECRET|MEILISEARCH_HOST|MEILISEARCH_API_KEY|UPSTASH_REDIS_REST_URL|UPSTASH_REDIS_REST_TOKEN|NEXT_PUBLIC_)' >> .env.production
        - npm run build
  artifacts:
    baseDirectory: .next
    files:
      - '**/*'
  cache:
    paths:
      - node_modules/**/*
      - .next/cache/**/*
